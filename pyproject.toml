[project]
name = "pysls"
version = "0.1.0"
description = "depois eu coloco alguma coisa"
readme = "README.md"
# homepage = "https://github.com/LucasFDutra/pysls"
authors = [
    { name = "LucasFDutra" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40.66",
]

[project.scripts]
pysls = "pysls:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.7.0",
    "taskipy>=1.14.1",
]
